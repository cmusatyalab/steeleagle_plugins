[project]
name = "steeleagle-aviary"
version = "0.1.5"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.76.0",
    "panda3d>=1.10.15",
    "pymap3d>=3.2.0",
    "colorhash",
    "opencv-python-headless",
    "steeleagle-protocol>=0.3.4",
    "uriel>=0.2.0",
]

[project.scripts]
start = "steeleagle_aviary:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steeleagle_aviary"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
# Pinned since panda3d only publishes wheels for released Python versions
python = "3.14.*"

[tool.pixi.pypi-dependencies]
steeleagle-aviary = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks] # start is defined under project.scripts
