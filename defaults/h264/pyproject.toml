[project]
name = "h264"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "protobuf>=7.35.1",
    "steeleagle-protocol>=0.3.4",
    "uriel>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h264"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.14.*"
# GStreamer and its Python bindings, with the elements the pipelines use:
# h264parse (bad), x264enc (ugly) and avdec_h264 (libav)
pygobject = "*"
gstreamer = "*"
gst-plugins-base = "*"
gst-plugins-bad = "*"
gst-plugins-ugly = "*"
gst-libav = "*"

[tool.pixi.pypi-dependencies]
h264 = { path = ".", editable = true }

[tool.pixi.feature.generate.dependencies]
buf = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
generate = { features = ["generate"], no-default-feature = true }

[tool.pixi.tasks]
# Runs the plugin named by STEELEAGLE_PLUGIN (see src/h264/main.py)
start = "python -m h264.main"

[tool.pixi.feature.generate.tasks]
# Regenerates src/h264/h264_pb2.py, which is committed
generate = "buf generate"
