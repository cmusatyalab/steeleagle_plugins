[project]
name = "h264"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "protobuf>=7.35.1",
    "steeleagle-protocol>=0.3.4",
    "uriel>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h264"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-64-glibc-2-27", platform = "linux-64", glibc = "2.27" },
    { name = "linux-aarch64-glibc-2-27", platform = "linux-aarch64", glibc = "2.27" },
]

[tool.pixi.dependencies]
python = "3.14.*"

# conda-forge GStreamer and its Python bindings, with the elements the
# pipelines use: h264parse (bad), x264enc (ugly) and avdec_h264 (libav)
[tool.pixi.feature.conda-gstreamer.dependencies]
pygobject = "*"
gstreamer = "*"
gst-plugins-base = "*"
gst-plugins-bad = "*"
gst-plugins-ugly = "*"
gst-libav = "*"

# native is the default environment with the device's own GStreamer plugins
# added, so that a Qualcomm hardware encoder or decoder (e.g. qtic2venc) loads
# into conda's GStreamer. Set GST_PLUGIN_PATH to the directory holding the
# device's plugins; their libraries are found in the system library
# directories.
[tool.pixi.feature.native]
platforms = ["linux-aarch64-glibc-2-27"]

[tool.pixi.feature.native.activation.env]
GST_PLUGIN_PATH = "/usr/lib/aarch64-linux-gnu/gstreamer-1.0"

[tool.pixi.pypi-dependencies]
h264 = { path = ".", editable = true }

[tool.pixi.feature.generate.dependencies]
buf = "*"

[tool.pixi.environments]
default = { features = ["conda-gstreamer"], solve-group = "default" }
native = { features = ["native", "conda-gstreamer"], solve-group = "default" }
generate = { features = ["generate"], no-default-feature = true }

[tool.pixi.tasks]
start = "python -m h264.main"

[tool.pixi.feature.generate.tasks]
# Regenerates src/h264/h264_pb2.py
generate = "buf generate"
