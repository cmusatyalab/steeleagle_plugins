[plugin]
name = "H.264 Decoder System"
type = "engine"
description = "Decodes the H.264 frames the H.264 encoder on a vehicle sends, back into camera frames (uses system Gstreamer)"

[[args]]
name = "decoder"
type = "string"
description = "H.264 decoder, in gst-launch syntax"
default = "avdec_h264 max-threads=1"

[[args]]
name = "max_output_size"
type = "number"
description = "Largest decoded frame sent, in bytes"
default = 6237184

[[args]]
name = "timeout_ms"
type = "number"
description = "Milliseconds a frame may take to decode before it is discarded"
default = 1000

[[args]]
name = "log_frames"
type = "boolean"
description = "Log every frame decoded"
default = false

[[args]]
name = "gstreamer_path"
type = "string"
description = "Path to local gstreamer library"
default = "/usr/lib/gstreamer-1.0"

[[args]]
name = "lib_path"
type = "string"
description = "Path to the system library directory"
default = "/usr/lib/"

[engine]
type = "filter"
inputs = ["steeleagle_protocol/v1/messages/frame/EncodedFrame"]
# Each frame is replaced with the RawFrame it decodes to; the result tells the
# encoder whether it decoded, or a keyframe is needed
result = "h264/v1/DecodeResult"
