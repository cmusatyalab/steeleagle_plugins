[project]
name = "jpeg"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "protobuf>=7.35.1",
    "steeleagle-protocol>=0.3.4",
    "uriel>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jpeg"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.14.*"
# GStreamer and its Python bindings, with the elements the pipelines use:
# jpegenc and jpegdec (good)
pygobject = "*"
gstreamer = "*"
gst-plugins-base = "*"
gst-plugins-good = "*"

[tool.pixi.pypi-dependencies]
jpeg = { path = ".", editable = true }

[tool.pixi.tasks]
# Runs the plugin named by STEELEAGLE_PLUGIN (see src/jpeg/main.py)
start = "python -m jpeg.main"
