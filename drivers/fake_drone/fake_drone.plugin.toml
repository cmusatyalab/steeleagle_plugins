[plugin]
name = "Fake Drone"
type = "driver"
description = "Replays a directory of pre-captured RGB frames from disk as a drone's live camera, for testing the pipeline without hardware"

[[args]]
name = "frames_dir"
type = "string"
description = "Directory of .rgb frame files to stream, sorted by filename, looping when exhausted"
default = "/home/particle/uriel/patchcore-pipeline/test_rgb_200"

[[args]]
name = "fps"
type = "number"
description = "Frames per second to stream at"
default = 30

[driver]
type = "copter"

[[driver.cameras]]
name = "rgb"
type = "steeleagle_protocol/v1/messages/frame/RawFrame"
description = "Simulated RGB camera, replaying raw frames from disk in a loop"
hres = 1280
vres = 720
fps = 30
gimbal = false
primary = true
encode = true

[driver.supported]
services = [
    "steeleagle_protocol/v1/services/driver/StreamService",
]
