[plugin]
name = "Fake Drone"
type = "driver"
description = "Replays a looping .mp4 file as a drone's live camera, for testing the pipeline without hardware"

[[args]]
name = "video_path"
type = "string"
description = "H.264 .mp4 file to stream, decoded and looped forever, paced to its own encoded framerate"
default = "/home/particle/uriel/patchcore-pipeline/test.mp4"

[[args]]
name = "decoder"
type = "string"
description = "H.264 decoder of the video stream, in gst-launch syntax; its output must be in system memory, and is converted to RGB after it"
default = "qtic2vdec ! qtivcrop crop-type=FastCV crop=<0,0,1920,1080>"

[[args]]
name = "netsim_profile"
type = "string"
description = "Simulated network condition on fermi's ingress from lambda2 (uriel port 9001): off, normal, limited, degraded, intermittent, or denied. malicious isn't supported yet."
default = "off"

[[args]]
name = "netsim_interface"
type = "string"
description = "Network interface on fermi to shape (required if netsim_profile is not off)"
default = ""

[[args]]
name = "netsim_direction"
type = "string"
description = "ingress or egress for the netsim shaping (fermi-to-lambda is egress)"
default = "egress"

[driver]
type = "copter"

[[driver.cameras]]
name = "rgb"
type = "steeleagle_protocol/v1/messages/frame/RawFrame"
description = "Simulated RGB camera, replaying a looping .mp4 file"
hres = 1280
vres = 720
fps = 30
gimbal = false
primary = true
encode = true

[driver.supported]
services = [
    "steeleagle_protocol/v1/services/driver/StreamService",
]
