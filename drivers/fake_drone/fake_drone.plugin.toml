[plugin]
name = "Fake Drone"
type = "driver"
description = "Replays an .mp4 file, looping by default, as a drone's live camera, for testing the pipeline without hardware"

[[args]]
name = "video"
type = "string"
description = "H.264 .mp4 file to replay at its own framerate: a file name in the daemon's files directory (STEELEAGLE_FILES, where `eagle transfer-file` saves files), or else a path"

[[args]]
name = "no_loop"
type = "boolean"
description = "Play the video once, then stop the plugin, instead of looping it forever"
default = false

[[args]]
name = "pad_after"
type = "boolean"
description = "With no_loop, keep sending blank (black) frames at 30 fps after the video ends, until the camera is no longer asked for, instead of stopping the plugin"
default = false

[[args]]
name = "decoder"
type = "string"
description = "H.264 decoder of the video, in gst-launch syntax; its output must be NV12, I420 or RGB, and is converted to RGB on the CPU after it (e.g. \"qtic2vdec\" with the native environment)"
default = "avdec_h264"

[[args]]
name = "telemetry"
type = "boolean"
description = "Attach the position and gimbal pose recorded in the video to each frame; only Parrot ANAFI recordings (v3 video metadata) have them"
default = false

[driver]
type = "copter"

[[driver.cameras]]
name = "rgb"
type = "steeleagle_protocol/v1/messages/frame/RawFrame"
description = "Simulated RGB camera, replaying an .mp4 file"
hres = 1280
vres = 720
fps = 30
gimbal = false
primary = true
encode = true

[driver.supported]
services = [
    "steeleagle_protocol/v1/services/driver/StreamService",
]
