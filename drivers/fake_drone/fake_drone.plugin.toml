[plugin]
name = "Fake Drone"
type = "driver"
description = "Replays a looping .mp4 file as a drone's live camera, for testing the pipeline without hardware"

[[args]]
name = "video_path"
type = "string"
description = "H.264 .mp4 file to replay, looping forever, at its own framerate"

[[args]]
name = "decoder"
type = "string"
description = "H.264 decoder of the video, in gst-launch syntax; its output must be NV12, I420 or RGB, and is converted to RGB on the CPU after it (e.g. \"qtic2vdec\" with the native environment)"
default = "avdec_h264"

[[args]]
name = "telemetry"
type = "boolean"
description = "Attach the position and gimbal pose recorded in the video to each frame; only Parrot ANAFI recordings (v3 video metadata) have them"
default = false

[driver]
type = "copter"

[[driver.cameras]]
name = "rgb"
type = "steeleagle_protocol/v1/messages/frame/RawFrame"
description = "Simulated RGB camera, replaying a looping .mp4 file"
hres = 1280
vres = 720
fps = 30
gimbal = false
primary = true
encode = true

[driver.supported]
services = [
    "steeleagle_protocol/v1/services/driver/StreamService",
]
