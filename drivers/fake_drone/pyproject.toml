[project]
name = "fake-drone"
version = "0.1.0"
# uriel needs 3.11+; nothing here pins an upper bound (no Olympe constraint
# like parrot_anafi has)
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.51.1",
    "opencv-python-headless>=5.0.0.93",
    "protobuf>=7.35.1",
    "steeleagle-protocol>=0.3.4",
    "uriel>=0.3.1",
]

[project.scripts]
start = "fake_drone:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-64-glibc-2-27", platform = "linux-64", glibc = "2.27" },
    { name = "linux-aarch64-glibc-2-27", platform = "linux-aarch64", glibc = "2.27" },
]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.pypi-dependencies]
fake-drone = { path = ".", editable = true }

# conda-forge GStreamer and its Python bindings, with the elements the video
# pipeline uses: qtdemux and capssetter (good), h264parse (bad) and
# avdec_h264 (libav), as parrot_anafi uses, but reading a file instead of
# the drone's RTSP stream.
[tool.pixi.feature.conda-gstreamer.dependencies]
pygobject = "*"
gstreamer = "*"
gst-plugins-base = "*"
gst-plugins-good = "*"
gst-plugins-bad = "*"
gst-libav = "*"

# native is the default environment with the device's own GStreamer plugins
# added, as in parrot_anafi, so that a Qualcomm hardware decoder (set with the
# decoder arg, e.g. "qtic2vdec") loads into conda's GStreamer. Its frames are
# still mapped into CPU memory and converted to RGB there. Set GST_PLUGIN_PATH
# to the directory holding the device's plugins; their libraries are found in
# the system library directories.
[tool.pixi.feature.native]
platforms = ["linux-aarch64-glibc-2-27"]

[tool.pixi.feature.native.activation.env]
GST_PLUGIN_PATH = "/usr/lib/aarch64-linux-gnu/gstreamer-1.0"

[tool.pixi.environments]
default = { features = ["conda-gstreamer"], solve-group = "default" }
native = { features = ["native", "conda-gstreamer"], solve-group = "default" }
