[plugin]
name = "PatchCore H.264 Decoder"
type = "engine"
description = "Decodes the H.264 frames the PatchCore H.264 encoder on the vehicle sends, back into raw RGB24 frames for the verifier"

[[args]]
name = "decoder"
type = "string"
description = "H.264 decoder, in gst-launch syntax"
default = "avdec_h264 max-threads=1"

[[args]]
name = "max_output_size"
type = "number"
description = "Largest decoded frame sent, in bytes"
default = 3145728

[[args]]
name = "timeout_ms"
type = "number"
description = "Milliseconds a frame may take to decode before it is discarded"
default = 1000

[[args]]
name = "log_frames"
type = "boolean"
description = "Log every frame decoded"
default = false

[engine]
type = "filter"
inputs = ["patchcore_pipeline/v1/h264/EncodedVideoFrame"]
result = "patchcore_pipeline/v1/h264/DecodeResult"
