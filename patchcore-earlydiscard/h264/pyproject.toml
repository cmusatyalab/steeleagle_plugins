[project]
name = "patchcore-h264"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "uriel>=0.2.0",
    "protobuf",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
gstreamer = "*"
gst-plugins-base = "*"
gst-plugins-good = "*"
gst-plugins-bad = "*"
pygobject = "*"

[tool.pixi.pypi-dependencies]
patchcore-h264 = { path = ".", editable = true }

[tool.pixi.tasks]
start = "python main.py"
