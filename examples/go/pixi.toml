[workspace]
authors = ["Mihir Bala <mkbala42@gmail.com>"]
channels = ["conda-forge"]
name = "go"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = {cmd = "go build -o main", inputs = ["*.go"], outputs = ["main"]}
start = {cmd = "./main", depends-on = ["build"]}

[dependencies]
go = ">=1.27.3,<2"
nodejs = ">=26.12.1,<26.13"
