[project]
name = "led-clock"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "opencv-python-headless>=4.10",
    "protobuf>=7.35.1",
    "steeleagle-protocol>=0.3.4",
    "uriel>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/led_clock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.14.*"

[tool.pixi.pypi-dependencies]
led-clock = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.2"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
# Runs the plugin (see src/led_clock/main.py)
start = "python -m led_clock.main"
# Latency statistics of a run: `pixi run summarize <frames.csv> [--min-confidence C] [--start S] [--end S]`
summarize = "python -m led_clock.summarize"

[tool.pixi.feature.test.tasks]
# Run with `pixi run -e test test`
test = "pytest"
