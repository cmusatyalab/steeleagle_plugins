[plugin]
name = "Prometheus"
type = "extra"
description = "Prometheus server that scrapes the Uriel metrics of every daemon the GCS knows, and the GCS's own, for the GCS's Metrics page. Run it as an extra service on the daemon that runs the GCS"

[[args]]
name = "listen_address"
type = "string"
description = "Address Prometheus serves its API and UI on"
default = ":9090"

[[args]]
name = "scrape_interval"
type = "string"
description = "How often each daemon's metrics are read, as a Prometheus duration"
default = "5s"

[[args]]
name = "retention"
type = "string"
description = "How long samples are kept, as a Prometheus duration"
default = "1d"

[[args]]
name = "gcs_url"
type = "string"
description = "Base URL of the GCS, which lists the daemons to scrape at /api/metrics/targets and serves its own metrics at /metrics"
default = "http://localhost:8002"

[[args]]
name = "storage_dir"
type = "string"
description = "Directory of Prometheus's database, relative to the plugin's directory unless absolute"
default = "data"
