[plugin]
name = "PatchCore Score"
type = "engine"
description = "Scores embeddings from the PatchCore embed engine against a FAISS memory bank; forwards anomalous frames as RawFrames, drops normal ones"

[[args]]
name = "bank_ckpt"
type = "string"
description = "Path to the PatchCore checkpoint (incl. memory bank and image threshold)"
default = ""

[[args]]
name = "faiss_index"
type = "string"
description = "Path to the FAISS index file matching bank_ckpt"
default = ""

[[args]]
name = "threshold"
type = "number"
description = "Anomaly-score threshold to override the one trained into bank_ckpt (blank/0 = use trained threshold)"
default = 0

[[args]]
name = "max_output_size"
type = "number"
description = "Largest RawFrame this engine will forward, in bytes (a 1280x720 RGB frame is 2764800)"
default = 3145728

[engine]
type = "filter"
inputs = ["steeleagle_protocol/v1/messages/result/FrameWithEmbedding"]
