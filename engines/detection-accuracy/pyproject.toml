[project]
name = "detection-accuracy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "uriel>=0.3.1",
    "protobuf",
]

[tool.setuptools]
py-modules = ["main", "detection_accuracy"]

[tool.setuptools.packages.find]
include = ["steeleagle_protocol*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-64-glibc-2-27", platform = "linux-64", glibc = "2.27" },
    { name = "linux-aarch64-glibc-2-27", platform = "linux-aarch64", glibc = "2.27" },
]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
detection-accuracy = { path = ".", editable = true }

[tool.pixi.tasks]
start = "python main.py"
