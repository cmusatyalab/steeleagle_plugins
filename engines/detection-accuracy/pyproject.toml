[project]
name = "detection-accuracy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "uriel>=0.2.0",
    "protobuf",
]

[tool.setuptools]
py-modules = ["main", "detection_accuracy"]

[tool.setuptools.packages.find]
include = ["steeleagle_protocol*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
detection-accuracy = { path = ".", editable = true }

[tool.pixi.tasks]
start = "uv run main.py"
