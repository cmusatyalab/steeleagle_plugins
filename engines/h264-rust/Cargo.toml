[package]
name = "h264-rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "SteelEagle engines that encode raw frames with H.264, and decode them, keyframe on gap"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# The release whose shared memory layout the daemon's Uriel has.
uriel = { git = "https://github.com/cmusatyalab/uriel", tag = "v0.2.0" }
gstreamer = { version = "0.25.4", features = ["v1_16"] }
gstreamer-app = { version = "0.25.2", features = ["v1_16"] }
gstreamer-video = { version = "0.25.4", features = ["v1_16"] }
protobuf = "3.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.4.5"

[build-dependencies]
protobuf-codegen = "3.7.2"
