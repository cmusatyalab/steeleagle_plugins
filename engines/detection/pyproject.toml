[project]
name = "detection"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "protobuf>=7.35.1",
    "pyproj",
    "rfdetr>=1.8.3",
    "shapely",
    "steeleagle-protocol>=0.3.4",
    "supervision>=0.29.1",
    "torch",
    "ultralytics>=8.4.66",
    "uriel>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: loads and runs real model weights, which may need to be downloaded",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.14.*"
# The opencv-python that ultralytics and supervision install links against it
libgl = "*"

[tool.pixi.pypi-dependencies]
detection = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.2"

# Pascal GPUs (e.g. GTX 1080 Ti, sm_61) are not supported by the default CUDA 13
# torch wheels, so the cuda126 environment installs torch built for CUDA 12.6.
# Start it with `pixi run -e cuda126 start`.
[tool.pixi.feature.cuda126.pypi-dependencies]
torch = { version = "==2.14.1", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.29.1", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
cuda126 = { features = ["cuda126"], solve-group = "cuda126" }

[tool.pixi.tasks]
# Runs the plugin named by STEELEAGLE_PLUGIN (see src/detection/main.py)
start = "python -m detection.main"

[tool.pixi.feature.test.tasks]
# Run with `pixi run -e test test`
test = "pytest"
