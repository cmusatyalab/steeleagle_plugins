[project]
name = "detection"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "protobuf>=7.35.1",
    "pyproj",
    "rfdetr>=1.8.3",
    "shapely",
    "steeleagle-protocol>=0.3.4",
    "supervision>=0.29.1",
    "torch",
    "ultralytics>=8.4.66",
    "uriel>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: loads and runs real model weights, which may need to be downloaded",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.14.*"

[tool.pixi.pypi-dependencies]
detection = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.2"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
# Runs the plugin named by STEELEAGLE_PLUGIN (see src/detection/main.py)
start = "python -m detection.main"

[tool.pixi.feature.test.tasks]
# Run with `pixi run -e test test`
test = "pytest"
