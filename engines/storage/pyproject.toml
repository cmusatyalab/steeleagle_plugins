[project]
name = "storage"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "protobuf>=7.35.1",
    "steeleagle-protocol>=0.3.4",
    "uriel>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.14.*"

[tool.pixi.pypi-dependencies]
storage = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.2"

[tool.pixi.feature.generate.dependencies]
buf = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
generate = { features = ["generate"], no-default-feature = true }

[tool.pixi.tasks]
# Runs the plugin named by STEELEAGLE_PLUGIN (see src/storage/main.py)
start = "python -m storage.main"

[tool.pixi.feature.test.tasks]
# Run with `pixi run -e test test`
test = "pytest"

[tool.pixi.feature.generate.tasks]
# Regenerates src/storage/storage_pb2.py
generate = "buf generate"
