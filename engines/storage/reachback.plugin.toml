[plugin]
name = "Reachback"
type = "engine"
description = "Stores every frame, and sends the remote engine the stored frame each of its ReachbackRequests asks for"

[[args]]
name = "remote"
type = "string"
description = "Service name of the engine on the remote daemon whose derived results (storage.v1.ReachbackRequest) ask for stored frames"
default = ""

[[args]]
name = "database"
type = "string"
description = "SQLite file to store frames in, kept across restarts; empty for a temporary one, removed when the engine stops"
default = ""

[[args]]
name = "max_output_size"
type = "number"
description = "Largest frame stored and sent, in bytes"
default = 6237184

[engine]
type = "filter"
inputs = ["steeleagle_protocol/v1/messages/frame/EncodedFrame"]
# No result: frames are dropped, or replaced with a stored EncodedFrame
