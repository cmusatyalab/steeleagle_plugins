[plugin]
name = "CLIP Box Reranker"
type = "engine"
description = "Reports which of a local detector's boxes is the target, if any: vetoes boxes like ones a remote verifier said no to, prefers boxes like ones it said yes to, and delivers the unverified boxes to the verifier, off the frame path, on its reintegration producer"

[[args]]
name = "detector"
type = "string"
description = "Service name of the detection engine on this daemon whose boxes are reranked (e.g. detection-qnn); it must get the same frames as this engine. Required"
default = ""

[[args]]
name = "verifier"
type = "string"
description = "Service name of the engine on the remote daemon that verifies crops (the verifier plugin, with question = \"box\"); a crop stays queued until its RESULT event for it shows it has the crop. Required"
default = ""

[[args]]
name = "class"
type = "string"
description = "The class reported, as the tracker asks for it, e.g. \"robotic dog\". Required"
default = ""

[[args]]
name = "classes"
type = "array"
description = "The detector's classes whose boxes are candidates, e.g. [\"robotic dog\", \"dog\"]; empty for class alone"
default = []

[[args]]
name = "prompt"
type = "string"
description = "What the target is, as a noun phrase, for the CLIP prompt score s. Optional: with neither this nor image, the most confident box is reported until the verifier's prompt heartbeat arrives. Replaced by the verifier's prompt when that differs, unless ignore_new"
default = ""

[[args]]
name = "image"
type = "string"
description = "An image of the target, instead of prompt: a file in the daemon's files directory (STEELEAGLE_FILES). With both set, image is used"
default = ""

[[args]]
name = "confidence"
type = "number"
description = "Least confidence for an unverified box (one the verifier's answers say nothing about) to be reported. Run the detector at a lower confidence to give the reranker more candidates: a box like one the verifier confirmed is reported at any confidence"
default = 0.5

[[args]]
name = "require_verified"
type = "boolean"
description = "Report only boxes like ones the verifier confirmed: no detection until it has, whatever the confidence"
default = false

[[args]]
name = "max_candidates"
type = "number"
description = "Most boxes of a frame embedded, best confidence first; each costs ~6 ms on the HTP"
default = 8

[[args]]
name = "context"
type = "number"
description = "Side of the square crop embedded, as a multiple of the box's longer side"
default = 1.25

[[args]]
name = "verify_context"
type = "number"
description = "Side of the square crop the verifier sees, the box drawn in red, as a multiple of the box's longer side"
default = 2.0

[[args]]
name = "min_verify_side"
type = "number"
description = "Least side of the crop the verifier sees, in pixels of the frame"
default = 96

[[args]]
name = "max_verify_side"
type = "number"
description = "Largest side of the crop the verifier sees, in pixels: a larger crop is scaled down to it. Set the verifier's min_side to enlarge small crops there, off the link"
default = 256

[[args]]
name = "novelty"
type = "number"
description = "Cosine similarity at which a crop counts as one already queued or answered within the cooldown, and is not queued, in (0, 1]"
default = 0.92

[[args]]
name = "cooldown"
type = "number"
description = "Seconds after the verifier answers a crop before crops like it are asked about again (to confirm a no or a yes)"
default = 5.0

[[args]]
name = "prompt_weight"
type = "number"
description = "Weight of the CLIP prompt score s against confidence when ranking unverified boxes; 0 ranks them by confidence alone"
default = 0.0

[[args]]
name = "rank"
type = "string"
description = "How a frame's unverified boxes (above confidence) are ranked: \"confidence\", the detector's (plus prompt_weight times s), or \"prompt\", their CLIP prompt score s against each other, as cliped ranks a frame's tiles: the box most like the prompt or image wins, whatever s's scale. A confirmed box wins either way. \"confidence\" only for a prompt that just names the detector's class, which can't tell its boxes apart"
default = "prompt"

[[args]]
name = "gate"
type = "boolean"
description = "Learns from the verifier's answers whether a frame's best box is the target at all, and reports none if not: an unverified box must be more like the prompt, over the class prompt, than the midpoint of the boxes the verifier said yes and no to. For a target that is one instance of the detector's class (a person in a red shirt among people). Needs a text prompt"
default = false

[[args]]
name = "class_prompt"
type = "string"
description = "With gate: the prompt for any box of the class, against which the prompt's likeness is measured. Default: \"a <first of classes>\" (e.g. \"a person\")"
default = ""

[[args]]
name = "ignore_new"
type = "boolean"
description = "Keep this engine's prompt (or image) whatever the verifier's prompt heartbeat says. Without it, a different prompt from the verifier replaces this one and all learning starts over"
default = false

[[args]]
name = "timeout"
type = "number"
description = "The longest to wait for the detector's result on a frame, in milliseconds; the frame then has no detection"
default = 1000

[[args]]
name = "learn_similarity"
type = "number"
description = "Cosine similarity of crop embeddings at which a crop counts as one the verifier said no to, in (0, 1]: lower vetoes more, and risks vetoing the target"
default = 0.85

[[args]]
name = "confirmations"
type = "number"
description = "No's, to crops within learn_similarity of each other, before crops like them are vetoed"
default = 2

[[args]]
name = "good_similarity"
type = "number"
description = "Cosine similarity of crop embeddings at which a crop counts as one the verifier said yes to, in (0, 1]"
default = 0.9

[[args]]
name = "good_confirmations"
type = "number"
description = "Yes's, to crops within good_similarity of each other, before crops like them are confirmed. A wrong confirmation reports a distractor at any confidence, so keep it at least 2"
default = 2

[[args]]
name = "max_learned"
type = "number"
description = "Most yes and most no answers kept learned, each; past it, the oldest is forgotten"
default = 32

[[args]]
name = "backgrounds"
type = "array"
description = "Background prompts, for the CLIP prompt score s"
default = ["grass", "dirt", "rocks", "trees", "a road", "a roof"]

[[args]]
name = "max_queue"
type = "number"
description = "Most crops waiting for the verifier; past it, the least confident is dropped"
default = 64

[[args]]
name = "quantized"
type = "boolean"
description = "Run the INT8 image encoder (models/image_encoder_int8.tflite); false runs the FP32 one in PyTorch on the CPU"
default = true

[[args]]
name = "npu"
type = "boolean"
description = "Run the INT8 image encoder on the HTP through QNN (libs/); false runs it on the CPU. Only with quantized"
default = true

[[args]]
name = "threads"
type = "number"
description = "CPU threads for the text encoder, and for the image encoder off the HTP"
default = 4

[[args]]
name = "log_tiles"
type = "boolean"
description = "Write each crop sent to the verifier to STEELEAGLE_FILES/<engine>/out/<frame id>_<candidate>.jpeg, as JPEG at quality 75"
default = false

[[args]]
name = "log_candidates"
type = "string"
description = "CSV file to log every candidate of every frame to: frame_id, timestamp_ns, candidate, class, score, its box (left, top, right, bottom) in a frame_width x frame_height frame, s, verdict (-1 vetoed, 0 unverified, 1 confirmed), reported, queued and ms. A relative path is in the daemon's files directory. Replaced when the plugin starts. Empty for none"
default = ""

[engine]
type = "detection"
inputs = ["steeleagle_protocol/v1/messages/frame/RawFrame"]
# Every frame is dropped; the box reported, named `class`, is its result, or
# it has none
result = "steeleagle_protocol/v1/messages/result/DetectionResult"

[[engine.producers]]
# Delivers the queued crops to the verifier, the box reported first, one at a
# time, each until the verifier's RESULT for it. Give it one token, and encode
# its crops (e.g. with the thumbnail plugin's WebP encoder) before they cross
# to the verifier.
name = "reintegration"
output = "steeleagle_protocol/v1/messages/frame/RawFrame"
