[plugin]
name = "CLIP Edge Filter"
type = "engine"
description = "Scores the tiles of each camera frame against a text or image prompt with MobileCLIP, forwards each frame's best tile, and delivers every tile worth sending to the remote verifier, best first, on its reintegration producer"

[[args]]
name = "prompt"
type = "string"
description = "What to search for, as a noun phrase, e.g. \"a red tarp\" or \"person lying down\". Optional: with neither this nor image, every frame is dropped until the verifier's prompt heartbeat sets the prompt"
default = ""

[[args]]
name = "image"
type = "string"
description = "An image of what to search for, instead of prompt: a file in the daemon's files directory (STEELEAGLE_FILES), e.g. \"target.jpg\". With both set, image is used"
default = ""

[[args]]
name = "verifier"
type = "string"
description = "Service name of the engine on the remote daemon that verifies tiles; a tile stays queued until its RESULT event for it shows it has the tile. Required"
default = ""

[[args]]
name = "quantized"
type = "boolean"
description = "Run the INT8 image encoder (image_encoder_int8.tflite in cliped/ in the daemon's models directory); false runs the FP32 one (distill_visual.pt) in PyTorch on the CPU"
default = true

[[args]]
name = "tile_size"
type = "number"
description = "Side of the square tiles a frame is cut into, in pixels (tuned for 720p frames: put the rescale engine before this one)"
default = 200

[[args]]
name = "stride"
type = "number"
description = "Distance between neighboring tiles, in pixels; below tile_size, tiles overlap"
default = 150

[[args]]
name = "margin"
type = "number"
description = "How far above the adaptive threshold a tile's score must be to be sent, in standard deviations of the frame's scores"
default = 0.25

[[args]]
name = "max_send"
type = "number"
description = "Most tiles of one frame queued to send"
default = 1

[[args]]
name = "backgrounds"
type = "array"
description = "Background prompts a tile must look less like than the prompt"
default = ["grass", "dirt", "rocks", "trees", "a road", "a roof"]

[[args]]
name = "k"
type = "number"
description = "Send budget the adaptive threshold tracks: it follows the k-th best score of each frame"
default = 2

[[args]]
name = "ema"
type = "number"
description = "Weight of the adaptive threshold's old value at each frame, in [0, 1): higher moves it slower"
default = 0.9

[[args]]
name = "max_queue"
type = "number"
description = "Most tiles waiting for the verifier; past it, the lowest-scored tile is dropped"
default = 64

[[args]]
name = "npu"
type = "boolean"
description = "Run the INT8 image encoder on the HTP through QNN (cliped/libs/ in the daemon's models directory); false runs it on the CPU. Only with quantized"
default = true

[[args]]
name = "threads"
type = "number"
description = "CPU threads for the text encoder, and for the image encoder off the HTP"
default = 4

[[args]]
name = "log_scores"
type = "boolean"
description = "Log every frame's scores, not only the frames that pick a tile"
default = false

[[args]]
name = "log_tiles"
type = "boolean"
description = "Write each input frame to STEELEAGLE_FILES/<engine>/in/<frame id>.jpeg and each tile sent to STEELEAGLE_FILES/<engine>/out/<frame id>_<tile number>.jpeg, as JPEG at quality 75"
default = false

[[args]]
name = "learn"
type = "boolean"
description = "Learn from the verifier's yes or no about each tile sent: tiles at least good_similarity to one it said yes to (confirmed by `good_confirmations` yes's) are sent, and tiles at least learn_similarity to one it said no to (confirmed by `confirmations` no's) are not, and the queued tiles are rescored, dropping the ones that no longer pass"
default = true

[[args]]
name = "learn_similarity"
type = "number"
description = "Cosine similarity of tile embeddings, in (0, 1], at which two tiles count as the same thing, for the background gate and for adding a background tile; lower suppresses more, and risks suppressing targets: below ~0.8 a small target lying on ground counts as that ground"
default = 0.85

[[args]]
name = "confirmations"
type = "number"
description = "No's, to tiles within learn_similarity of each other, before tiles like them stop being sent; 2 keeps one wrong no from the verifier from suppressing a target"
default = 2

[[args]]
name = "good_similarity"
type = "number"
description = "Cosine similarity of tile embeddings, in (0, 1], at which a tile counts as the same thing as one the verifier said yes to, for forcing it to be sent and for adding a good tile; above learn_similarity because tiles of one scene are ~0.8 similar, so a good tile that close would force the plain ground around the target"
default = 0.9

[[args]]
name = "good_confirmations"
type = "number"
description = "Yes's, to tiles within good_similarity of each other, before tiles like them are sent whatever their score; 2 keeps one wrong yes from the verifier from crowding the target out of every frame. A no to a tile that close to an unconfirmed one counts against it, and once the no's reach its yes's it is forgotten"
default = 2

[[args]]
name = "max_learned"
type = "number"
description = "Most yes and most no answers kept learned, each; past it, the oldest is forgotten"
default = 32

[[args]]
name = "log_sent"
type = "string"
description = "CSV file to log each tile picked and queued to send to, as frame_id, timestamp_ns (the frame's capture timestamp, which the tile keeps), tile (its number in the frame), the tile's left, top, right and bottom in pixels of its frame_width x frame_height frame, score and class (the prompt); a relative path is in the daemon's files directory (STEELEAGLE_FILES). Replaced when the plugin starts. Empty for none"
default = ""

[[args]]
name = "log_scored"
type = "string"
description = "CSV file to log each frame scored to, whether or not a tile is picked from it, as frame_id, timestamp_ns (its capture timestamp), tiles (how many it was cut into), best_score, threshold (the adaptive one), picked (tiles queued) and ms (time to score it); the frames missing from it were never scored. A relative path is in the daemon's files directory (STEELEAGLE_FILES). Replaced when the plugin starts. Empty for none"
default = ""

[[args]]
name = "defer_similar"
type = "boolean"
description = "Send a picked tile that is a near-copy of one queued or sent before (the same view, slid or turned a little as the camera moves) only after every new tile: ORB keypoints matching under one rotation, scale and shift. It is still sent once nothing new waits, unless the full queue drops it first. Checked only on the tiles picked to send, ~5 ms each on the Tachyon"
default = false

[[args]]
name = "defer_similar_matches"
type = "number"
description = "Keypoints (of 200) of a picked tile that must match a tile sent before for it to count as a near-copy, with defer_similar; lower counts more tiles as copies. Consecutive tiles of one object matched 45-139, unrelated tiles at most ~25, and one person from two angles 30"
default = 40

[[args]]
name = "ignore_new"
type = "boolean"
description = "Keep this prompt (prompt or image, which must be set), whatever the verifier's prompt heartbeat says; false follows the verifier's prompt: its description, else its class, replaces this one, and learning starts over"
default = false

[[args]]
name = "visual_guard"
type = "boolean"
description = "With learn: a no is kept from being learned only if its tile is visually (ORB keypoints, defer_similar_matches of them) a tile the verifier said yes to; false keeps the CLIP cosine guard, which in aerial video, where tiles' embeddings are all alike, keeps almost every no from being learned"
default = true

[[args]]
name = "propagate_s"
type = "number"
description = "With learn: each answer of the verifier is also learned for the unanswered tiles picked in the last this many seconds that are visually the answered tile (ORB keypoints, defer_similar_matches of them), so one answer can confirm what is seen frame after frame; 0 learns only the answered tile. ~6 ms an answer on a Cortex-A55 core at 20"
default = 20.0

[engine]
type = "classification"
inputs = ["steeleagle_protocol/v1/messages/frame/RawFrame"]
# Each frame is replaced with the best tile cut from it, an RGB RawFrame at
# native resolution with the id and pose of the frame, or dropped if it has
# none. It is not tracked: route only the reintegration producer to the
# verifier, and leave the engine a dead end (no edge out of it).
forwards = "steeleagle_protocol/v1/messages/frame/RawFrame"
# The tile sent: class the prompt (the text, or the image's file name), score s
result = "steeleagle_protocol/v1/messages/result/ClassificationResult"

[[engine.producers]]
# Delivers the queued tiles to the verifier, best first, one at a time, each
# until the verifier's RESULT for it, whether or not frames come in. Give it
# one token, and encode its tiles (e.g. with the thumbnail plugin's WebP
# encoder) before they cross to the verifier.
name = "reintegration"
output = "steeleagle_protocol/v1/messages/frame/RawFrame"
