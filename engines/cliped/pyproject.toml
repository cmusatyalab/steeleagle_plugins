[project]
name = "cliped"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
# What the engine and the tools share: the encoders and the tiling
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "torch>=2.6",
    "torchvision",
    "open_clip_torch>=3.0",
    "timm>=1.0.30",
    # 1.2.0 runs the QNN TFLite delegate on the Tachyon
    "ai-edge-litert==1.2.0",
]

[project.optional-dependencies]
# The engine itself. Kept apart from the tools, whose TensorFlow needs an
# older protobuf than the protocol does.
engine = [
    "protobuf>=7.35.1",
    "steeleagle-protocol>=0.3.4",
    "uriel>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cliped"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.pypi-dependencies]
cliped = { path = ".", editable = true, extras = ["engine"] }
# CPU builds: the Tachyon has no CUDA, and the CUDA wheels are gigabytes
torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.2"

# Quantizing and evaluating (tools/): TensorFlow and onnx2tf, without the
# engine's protocol packages
[tool.pixi.feature.tools.dependencies]
python = "3.11.*"

[tool.pixi.feature.tools.pypi-dependencies]
cliped = { path = ".", editable = true }
torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
numpy = ">=1.26,<2.2"
tensorflow = "==2.19.0"
tf_keras = "==2.19.0"
onnx = "==1.17.0"
onnx2tf = "==1.28.8"
onnxslim = ">=0.1.99"
onnx_graphsurgeon = ">=0.6.1"
sng4onnx = ">=2.0.1"
psutil = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
tools = { features = ["tools"], no-default-feature = true }

[tool.pixi.tasks]
# Runs the engine (see src/cliped/main.py)
start = "python -m cliped.main"

[tool.pixi.feature.test.tasks]
# Run with `pixi run -e test test`
test = "pytest"

[tool.pixi.feature.tools.tasks]
# Run with `pixi run -e tools <task> [args]`; see tools/README.md
quantize = { cmd = "python tools/quantize_clip.py", env = { HF_HOME = "$PIXI_PROJECT_ROOT/tools/hf" } }
evaluate = { cmd = "python tools/evaluate.py", env = { HF_HOME = "$PIXI_PROJECT_ROOT/tools/hf" } }
