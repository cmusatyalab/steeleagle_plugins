[plugin]
name = "CLIP Edge Filter Verifier"
type = "engine"
description = "Asks a vision-language model on Ollama (Qwen3-VL 30B-A3B Instruct by default) whether each frame, e.g. a tile from the CLIP edge filter, matches a text or image prompt; forwards the frames that do and drops the rest"

[[args]]
name = "prompt"
type = "string"
description = "What to look for, as a noun phrase, e.g. \"a red tarp\" or \"person lying down\"; this or image is required, unless the live directory holds the prompt"
default = ""

[[args]]
name = "image"
type = "string"
description = "An image of what to look for, instead of prompt: a file in the daemon's files directory (STEELEAGLE_FILES), e.g. \"target.jpg\". With both set, image is used"
default = ""

[[args]]
name = "model"
type = "string"
description = "Ollama model to ask; pulled at startup if the server does not have it"
default = "qwen3-vl:30b-a3b-instruct"

[[args]]
name = "host"
type = "string"
description = "URL of the Ollama server; blank uses OLLAMA_HOST, or http://localhost:11434"
default = ""

[[args]]
name = "timeout_ms"
type = "number"
description = "Milliseconds to wait for the model's answer about one frame before dropping it"
default = 30000

[[args]]
name = "question"
type = "string"
description = "The question asked about each frame, instead of the default one; {prompt} in it is replaced by prompt (or the image's name). With image, the model sees the reference first and the frame second. It should ask for a yes or no answer: anything but yes drops the frame. Blank uses the default question; \"box\" asks about the object in the red box, for box_rerank's crops: whether it is the prompt, or, with image, the reference's target"
default = ""

[[args]]
name = "image_mode"
type = "string"
description = "How an image prompt is verified: \"image\" shows the model the image with each frame; \"description\" asks the model once what kind of thing the image shows, in a few words (e.g. \"a quadruped robot dog\"), and verifies each frame against that text. Description rejects look-alikes of other kinds (on live crops of a robot dog, it said yes to 4 of 80 others, against 25 with the image); image tells individuals of one kind apart (one person among others, where description is just \"a person\"). No effect on a text prompt"
default = "image"

[[args]]
name = "min_side"
type = "number"
description = "Enlarge each frame so its shorter side is at least this many pixels before the model sees it, e.g. box_rerank's small crops; 0 for as is"
default = 0

[[args]]
name = "log_tiles"
type = "boolean"
description = "Write each input frame to STEELEAGLE_FILES/<engine>/in/<frame id>.jpeg and each frame forwarded to STEELEAGLE_FILES/<engine>/out/<frame id>_0.jpeg, as JPEG at quality 75"
default = false

[[args]]
name = "num_ctx"
type = "number"
description = "Tokens of context the model is loaded with; 0 for Ollama's default, the model's full context (262144 for Qwen3-VL), whose cache takes far more GPU memory: 42 GB for qwen3-vl:8b-instruct, against 5.8 GB at 4096. A request needs well under 4096"
default = 4096

[[args]]
name = "live"
type = "string"
description = "A live directory, under STEELEAGLE_FILES, to take the question and prompt from while running: question.txt, and prompt.txt or prompt.jpg/prompt.jpeg (an image wins over text). Read at startup, where they win over question, prompt and image, and again whenever they change; a file removed keeps what was last read. Blank for none"
default = ""

[[args]]
name = "heartbeat"
type = "number"
description = "Seconds between prompt heartbeats: DERIVED events (type cliped/Prompt) holding the prompt's description as UTF-8 text, the text prompt or the model's description of the image, which box_rerank follows. They start once the first input has come"
default = 1.0

[engine]
type = "filter"
inputs = ["steeleagle_protocol/v1/messages/frame/RawFrame"]
# Each RGB frame the model says matches is forwarded unchanged, and every other
# frame is dropped. Either way the result is a GenericResult holding the JSON
# {"match": true|false}, so cliped's send queue sees a RESULT for every tile
# it sent, and learns from it.
result = "steeleagle_protocol/v1/messages/result/GenericResult"
