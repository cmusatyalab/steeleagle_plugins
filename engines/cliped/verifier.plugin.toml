[plugin]
name = "CLIP Edge Filter Verifier"
type = "engine"
description = "Asks a vision-language model on Ollama (Qwen3-VL 30B-A3B Instruct by default) whether each frame, e.g. a tile from the CLIP edge filter, matches a text prompt (an image prompt is turned into text first); forwards the frames it says yes or is unsure about and drops the rest"

[[args]]
name = "prompt"
type = "string"
description = "What to look for, as a noun phrase, e.g. \"a red tarp\" or \"person lying down\"; this or image is required, unless the live directory holds the prompt"
default = ""

[[args]]
name = "image"
type = "string"
description = "An image of what to look for, instead of prompt: a file in the daemon's files directory (STEELEAGLE_FILES), e.g. \"target.jpg\". The model turns it into a text prompt once (see image_mode), and is never shown it with a frame. With both set, image is used"
default = ""

[[args]]
name = "model"
type = "string"
description = "Ollama model to ask; pulled at startup if the server does not have it"
default = "qwen3-vl:30b-a3b-instruct"

[[args]]
name = "host"
type = "string"
description = "URL of the Ollama server; blank uses OLLAMA_HOST, or http://localhost:11434"
default = ""

[[args]]
name = "timeout_ms"
type = "number"
description = "Milliseconds to wait for the model's answer about one frame before dropping it"
default = 30000

[[args]]
name = "question"
type = "string"
description = "The question asked about each frame, instead of the default one; {prompt} in it is replaced by the text prompt (an image's text). It should ask for a yes or no answer. Blank uses the default question; \"box\" asks whether the object in the red box is the prompt, for box_rerank's crops"
default = ""

[[args]]
name = "image_mode"
type = "string"
description = "How an image prompt becomes the text prompt, of the verifier and of CLIP (box_rerank follows it through the heartbeat): \"class\", just its kind (e.g. \"a quadruped robot dog\", \"a person\"), which rejects look-alikes of other kinds best (on live crops of a robot dog, its kind said yes to 4 of 80 others, a detailed description to 43); \"descriptive\", a short description of what it shows, with its noticeable colors and features visible from far above (e.g. \"Mannequin in dark green shirt and black pants\"), to tell an individual from others of its kind; \"contrastive\", a description of the colors and features that set it apart from the distractors (see distractors; descriptive's while there are none). No effect on a text prompt"
default = "class"

[[args]]
name = "distractors"
type = "array"
description = "With image_mode \"contrastive\": images of other things of the target's kind to tell it apart from, files in STEELEAGLE_FILES, e.g. [\"other_person.jpg\"]. The live directory's d1.jpg, d2.jpg, ... join them, and the image is described again when they change; at most the 5 newest are shown"
default = []

[[args]]
name = "min_side"
type = "number"
description = "Enlarge each frame so its shorter side is at least this many pixels before the model sees it, e.g. box_rerank's small crops; 0 for as is"
default = 0

[[args]]
name = "log_tiles"
type = "boolean"
description = "Write each input frame to STEELEAGLE_FILES/<engine>/in/<frame id>.jpeg and each frame forwarded to STEELEAGLE_FILES/<engine>/out/<frame id>_0.jpeg, as JPEG at quality 75"
default = false

[[args]]
name = "num_ctx"
type = "number"
description = "Tokens of context the model is loaded with; 0 for Ollama's default, the model's full context (262144 for Qwen3-VL), whose cache takes far more GPU memory: 42 GB for qwen3-vl:8b-instruct, against 5.8 GB at 4096. A request needs well under 4096"
default = 4096

[[args]]
name = "live"
type = "string"
description = "A live directory, under STEELEAGLE_FILES, to take the question and prompt from while running: question.txt, and prompt.txt or prompt.jpg/prompt.jpeg (an image wins over text). Read at startup, where they win over question, prompt and image, and again whenever they change; a file removed keeps what was last read. Blank for none"
default = ""

[[args]]
name = "heartbeat"
type = "number"
description = "Seconds between prompt heartbeats: DERIVED events (type cliped/Prompt) holding the text prompt as UTF-8, an image's text for an image, which box_rerank follows. They start once the first input has come"
default = 1.0

[[args]]
name = "yes_conf"
type = "number"
description = "The least P(yes), the model's probability of yes as its first token, for a yes; over 0.5 and at most 1. A frame neither a yes nor a no (P(no) at least no_conf) is unsure: forwarded like a yes, but its result is {\"match\": null, \"unsure\": true}, so cliped and box_rerank learn nothing from it. Qwen3-VL 30B leans to no: on mannequin tiles, every frame between P(yes) 0.3 and 0.7 was a real mannequin. If the model gives no probabilities, its word decides"
default = 0.7

[[args]]
name = "no_conf"
type = "number"
description = "The least P(no) for a no, which drops the frame; over 0.5 and at most 1. See yes_conf"
default = 0.9

[engine]
type = "filter"
inputs = ["steeleagle_protocol/v1/messages/frame/RawFrame"]
# Each RGB frame the model says matches is forwarded unchanged, and every other
# frame is dropped. Either way the result is a GenericResult holding the JSON
# {"match": true|false}, so cliped's send queue sees a RESULT for every tile
# it sent, and learns from it. An unsure frame (yes_conf, no_conf) is
# forwarded with {"match": null, "unsure": true}, which isn't learned from;
# every result also holds "p_yes" and "p_no".
result = "steeleagle_protocol/v1/messages/result/GenericResult"
