[plugin]
name = "SwiftMap Reachback"
type = "engine"
description = "Stores frames with where the camera was and where it looked, and forwards every frame unchanged. For each weak target the swiftmap engine on the remote daemon asks about, the stored frame that sees it closest to the centre of its view is sent to that daemon as a file, outside the flow. Put it after the JPEG encoder and before the keyframe engine"

[[args]]
name = "remote"
type = "string"
description = "Service name of the swiftmap engine on the remote daemon, whose requests it answers"
default = "swiftmap"

[engine]
type = "filter"
inputs = ["steeleagle_protocol/v1/messages/frame/EncodedFrame"]
# No result: every frame is forwarded unchanged
