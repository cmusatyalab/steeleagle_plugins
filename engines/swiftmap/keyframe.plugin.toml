[plugin]
name = "SwiftMap Keyframe Filter"
type = "engine"
description = "Early discard for SwiftMap: forwards only the camera frames taken send_distance meters or more from the last one forwarded that the SwiftMap server would keep as keyframes, by its optical-flow test, and drops the rest before they cross the network"

[[args]]
name = "send_distance"
type = "number"
description = "Forward at most one frame per this many meters of travel; 0 to not check distance. Frames without a GPS fix are dropped unless it is 0"
default = 5.0

[[args]]
name = "min_disparity"
type = "number"
description = "Optical-flow disparity from the last keyframe, in pixels at the frame's resolution, a frame needs to be the next keyframe; 0 to not check it. It means what the server's SWIFTMAP_MIN_DISPARITY does"
default = 40.0

[engine]
type = "filter"
inputs = [
    "steeleagle_protocol/v1/messages/frame/RawFrame",
    "steeleagle_protocol/v1/messages/frame/EncodedFrame",
]
# No result: each frame that passes both checks is forwarded unchanged, and
# every other frame is dropped. Put it before the swiftmap engine (or a JPEG
# encoder in front of it) on the daemon whose camera takes the frames.
