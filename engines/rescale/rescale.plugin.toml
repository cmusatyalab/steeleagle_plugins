[plugin]
name = "Rescale"
type = "engine"
description = "Rescales camera frames to a target resolution and sends them on"

[[args]]
name = "resolution"
type = "string"
description = "Resolution to rescale frames to: 4k, 1080p, 720p, 480p, 360p, 240p or 180p by its height; required. The aspect_ratio sets its width. Frames already at it are sent on unchanged"
default = ""

[[args]]
name = "aspect_ratio"
type = "string"
description = "Aspect ratio to rescale frames to, as W:H (e.g. 16:9, 4:3, 1:1); the width is the resolution's height times W/H, rounded to an even number of pixels"
default = "16:9"

[engine]
type = "filter"
inputs = ["steeleagle_protocol/v1/messages/frame/RawFrame"]
# No result: each frame is replaced with its rescaled copy
