[plugin]
name = "PatchCore Retrain"
type = "engine"
description = "Watches every frame verifier forwards (TP and FP); swaps patchcore-score to a better existing memory bank, or collects FP frames and retrains a new one, when FPs stay high; forwards true positives on to the encoder"

[[args]]
name = "daemon_addr"
type = "string"
description = "host:port of fermi's eagled gRPC TransferService, used to push a new/candidate bank's faiss+meta files there"
default = "fermi.local:50051"

[[args]]
name = "verifier_name"
type = "string"
description = "Local name of the verifier engine on this daemon, subscribed to for its per-frame TP/FP result"
default = "patchcore-verifier"

[[args]]
name = "forward_all"
type = "boolean"
description = "Forward every frame (TP and FP) to the encoder instead of only true positives -- useful for debugging the pipeline end to end"
default = false

[[args]]
name = "n_max"
type = "number"
description = "Sliding FP window cap; oldest entry evicted beyond this"
default = 20

[[args]]
name = "m_min"
type = "number"
description = "Minimum window size before the FP rate is evaluated at all"
default = 8

[[args]]
name = "fp_rate_trigger"
type = "number"
description = "Fraction of the window that must be FPs to trigger a swap/retrain evaluation"
default = 0.8

[[args]]
name = "window_stale_seconds"
type = "number"
description = "Evict the window's oldest entry if it's older than this, even if the window is under n_max"
default = 60.0

[[args]]
name = "tolerance_fraction"
type = "number"
description = "Fraction of a triggered window's FP entries a candidate bank may still flag as FP and still count as passing"
default = 0.05

[[args]]
name = "retrain_collect_seconds"
type = "number"
description = "How long to keep collecting FP frames before training a new bank, once no existing bank passes"
default = 30.0

[[args]]
name = "default_bank_size"
type = "number"
description = "Target memory-bank vector count for a freshly trained bank"
default = 1000

[[args]]
name = "max_output_size"
type = "number"
description = "Largest message this engine will emit (a forwarded true-positive RawFrame, not just the swap notification)"
default = 3145728

[engine]
type = "filter"
inputs = ["steeleagle_protocol/v1/messages/frame/RawFrame"]
